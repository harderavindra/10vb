<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>When Life Was Simple</title>
  </head>
  <body>
    <div id="app">
      <div id="hero-container">
        <div class="lang-toggle">
          <button id="en-btn" class="lang-btn active">A</button>
          <button id="mr-btn" class="lang-btn">अ</button>
        </div>
        <div class="button-group">
          <button id="skip-btn" class="skip-btn">Skip</button>
          <span id="step-indicator">1 / 4</span>
          <button id="continue-btn">Continue</button>
          <!-- <button id="game-btn" style="margin-left: 12px;">Play Game</button> -->
        </div>
        <img id="more-img" src="src/assets/more.png" alt="more" />
        <div class="quote-content step-1">
          <p id="quote-text">When life was simple…</p>
          <img id="vb" width="200px" src="src/assets/10vb.png" alt="vb" />
        </div>
        <div class="quote-content step-2" style="align-items: end">
          <p id="bags-text">and happiness fit in a school bag.</p>
          <img id="bags-img" src="src/assets/bags.png" alt="bags" />
        </div>
        <div class="quote-content step-3" style="align-items: end">
          <p id="book-text">We made it work</p>
          <img id="book-img" src="src/assets/notebook.png"  />
          <p id="book-text2">with whatever we had</p>
        </div>
        <div

            align-items: end;
            height: 100vh;
            justify-content: start;
            padding-top: 40px;

            Not everything was perfect… but everything felt right.
          </p>
          <div id="remember-images">
            <img
             
              src="src/assets/kismi.png"

            />
            <img
             
              src="src/assets/poppins.png"
              
              style="
                opacity: 1;

              "
            />
            <img
             
              src="src/assets/bhingri.png"

              "
            />
            <img
             
              src="src/assets/pen.png"

                opacity: 1;

                position: absolute;
                top: 293px;
                left: 84px;
              "
            />
            <img
             
              src="src/assets/boomer.png"
              
              style="
                opacity: 1;
                width: 240px;
                position: absolute;
                top: 248px;
                right: 13px;
              "
            />
            <img
             
              src="src/assets/tickly.png"
              
              style="
                opacity: 1;
                width: 157px;
                position: absolute;
                top: 523px;
                left: 143px;
              "
            />
            <img
             
              src="src/assets/game.png"
              
              style="
                opacity: 1;
                width: 340px;
                position: absolute;

                left: -149px;
              "
            />
            <img
             
              src="src/assets/jahaj.png"
              
              style="
                opacity: 1;
                width: 296px;
                position: absolute;

                right: -133px;
              "
            />
            <img
             
              src="src/assets/cassette.png"
              
              style="
                opacity: 1;
                width: 360px;
                position: absolute;
                bottom: -120px;
                left: -24px;
              "
            />
          </div>
        </div>
        <div class="quote-content step-6" id="meet-text" style="align-items: end">
          <p class="meet-text2" >Let’s meet again… and feel it all once more.</p>
          <button id="game-btn">Play Game</button>
          <div id="coming-soon">
            <p>Coming Soon...</p>
            <p>Attendance</p>

          </div>
        
        </div>
